# Local Jaeger all-in-one. The agent exports OTLP/HTTP when
# OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC (unused by this binary; HTTP is the built-in exporter)
